<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Antigravity Bridge</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#e6edf3;
    height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .header { background:linear-gradient(135deg,#1a1f2e,#0f172a); border-bottom:1px solid #30363d;
    padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .logo { width:26px;height:26px; background:linear-gradient(135deg,#7c3aed,#3b82f6);
    border-radius:6px; display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:bold;color:#fff; }
  .header h1 { font-size:13px; font-weight:600; color:#c9d1d9; flex:1; }
  .gear { cursor:pointer; color:#6e7681; font-size:14px; padding:2px 4px; }
  .gear:hover { color:#c9d1d9; }
  .status-bar { padding:5px 14px; font-size:10px; background:#161b22;
    border-bottom:1px solid #21262d; display:flex; gap:10px; align-items:center; flex-shrink:0; }
  .status-dot { width:6px;height:6px;border-radius:50%; }
  .status-dot.online  { background:#3fb950; }
  .status-dot.offline { background:#f85149; }
  .tabs { display:flex; background:#161b22; border-bottom:1px solid #21262d; flex-shrink:0; }
  .tab { flex:1; padding:8px 4px; font-size:10px; cursor:pointer; text-align:center;
    color:#6e7681; border-bottom:2px solid transparent; transition:all .2s; }
  .tab:hover { color:#c9d1d9; }
  .tab.active { color:#7c3aed; border-bottom-color:#7c3aed; }
  .content { flex:1; overflow-y:auto; padding:10px; display:none; flex-direction:column; gap:8px; }
  .content.active { display:flex; }
  .chat-area { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:0; }
  .msg { padding:7px 9px; border-radius:7px; font-size:11px; line-height:1.5; max-width:92%; }
  .msg.user      { background:#1d2d50; align-self:flex-end; color:#a5d6ff; }
  .msg.assistant { background:#1a1f2e; border:1px solid #30363d; align-self:flex-start; }
  .msg.system    { background:#1a2433; align-self:center; color:#6e7681; font-size:10px; font-style:italic; text-align:center; }
  .input-area { display:flex; gap:5px; flex-shrink:0; margin-top:6px; }
  .input-area textarea { flex:1; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:7px; padding:7px; font-size:11px; resize:none; outline:none;
    height:52px; font-family:inherit; }
  .input-area textarea:focus { border-color:#7c3aed; }
  .btn { background:linear-gradient(135deg,#7c3aed,#3b82f6); border:none; color:white;
    border-radius:7px; padding:6px 10px; cursor:pointer; font-size:11px; font-weight:600; transition:opacity .2s; }
  .btn:hover { opacity:.85; }
  .btn.secondary { background:#21262d; color:#c9d1d9; }
  .action-row { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
  .action-row .btn { font-size:10px; padding:4px 7px; }
  .capture-card { background:#161b22; border:1px solid #30363d; border-radius:7px; padding:9px; font-size:11px; }
  .capture-card .label { color:#7c3aed; font-weight:600; margin-bottom:3px; font-size:10px; }
  .capture-card .text  { color:#c9d1d9; line-height:1.4; word-break:break-word; }
  .capture-card .url   { color:#3b82f6; font-size:9px; margin-top:3px; word-break:break-all; }
  .sync-btn-row { display:flex; gap:5px; margin-top:5px; }
  .ki-item { background:#161b22; border:1px solid #21262d; border-radius:5px;
    padding:7px 9px; font-size:11px; cursor:pointer; transition:border-color .2s; }
  .ki-item:hover { border-color:#7c3aed; }
  .ki-item .ki-title { font-weight:600; color:#c9d1d9; margin-bottom:1px; }
  .ki-item .ki-meta  { color:#6e7681; font-size:9px; }
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:#0d1117; }
  ::-webkit-scrollbar-thumb { background:#30363d; border-radius:2px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">AG</div>
  <h1>Antigravity Bridge</h1>
  <span class="gear" id="openOptionsBtn" title="Configurações">⚙️</span>
</div>
<div class="status-bar">
  <span class="status-dot offline" id="bridgeDot"></span>
  <span id="bridgeStatus" style="flex:1">verificando...</span>
  <span id="pageTitle" style="color:#3b82f6;font-size:9px;max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">-</span>
</div>
<div class="tabs">
  <div class="tab active" data-tab="chat">💬 Chat</div>
  <div class="tab" data-tab="capture">📋 Captura</div>
  <div class="tab" data-tab="cerebro">🧠 Cérebro</div>
</div>

<!-- CHAT -->
<div class="content active" id="tab-chat">
  <div class="chat-area" id="chatArea">
    <div class="msg system">Antigravity Bridge v2.0 — GitHub Sync.<br>Configure nas ⚙️ Opções para acesso cross-device.</div>
  </div>
  <div class="input-area">
    <textarea id="chatInput" placeholder="Prompt ou contexto... (Ctrl+Enter para enviar)"></textarea>
    <button class="btn" id="sendBtn">▶</button>
  </div>
  <div class="action-row">
    <button class="btn secondary" id="extractPageBtn">📄 Extrair</button>
    <button class="btn secondary" id="openAntigravityBtn">🚀 IDE</button>
    <button class="btn secondary" id="openWABtn">💬 WhatsApp</button>
    <button class="btn secondary" id="openOptionsBtn2">⚙️ Config</button>
  </div>
</div>

<!-- CAPTURE -->
<div class="content" id="tab-capture">
  <div id="captureArea"><div class="msg system">Use o menu de contexto: clique direito → "Enviar para Antigravity".</div></div>
</div>

<!-- CEREBRO -->
<div class="content" id="tab-cerebro">
  <div style="font-size:10px;color:#6e7681;margin-bottom:6px">Knowledge Items — GitHub / Local</div>
  <div id="kiList"><div class="msg system">Carregando...</div></div>
  <div class="action-row" style="margin-top:6px">
    <button class="btn secondary" id="refreshKIBtn">🔄 Atualizar</button>
    <button class="btn secondary" id="openOptionsBtn3">⚙️ Configurar GitHub</button>
  </div>
</div>

<script>
document.getElementById('openOptionsBtn')?.addEventListener('click', () => chrome.runtime.openOptionsPage());
document.getElementById('openOptionsBtn2')?.addEventListener('click', () => chrome.runtime.openOptionsPage());
document.getElementById('openOptionsBtn3')?.addEventListener('click', () => chrome.runtime.openOptionsPage());
</script>
<script src="sidebar.js"></script>
</body>
</html>
